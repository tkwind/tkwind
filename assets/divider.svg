<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="img" aria-label="divider">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.14" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.86" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edges"><rect width="1200" height="28" fill="url(#fade)"/></mask>
    <style>
      .s { fill: none; stroke-linecap: round; }
      @keyframes gust { to { stroke-dashoffset: -1600; } }
      .a { stroke: #4FB3AC; stroke-dasharray: 180 1220; stroke-dashoffset: 1400; animation: gust 7s linear infinite; }
      .b { stroke: #4FB3AC; stroke-dasharray:  90 1310; stroke-dashoffset: 1400; animation: gust 9.5s linear infinite -2s; }
      .c { stroke: #E08A3C; stroke-dasharray: 130 1270; stroke-dashoffset: 1400; animation: gust 6.2s linear infinite -1s; }
      @media (prefers-reduced-motion: reduce) { .a,.b,.c { animation: none; } }
    </style>
  </defs>
  <g mask="url(#edges)">
    <path class="s a" d="M-120 8  C 300 2, 700 16, 1320 6"  stroke-width="1.6" opacity=".55"/>
    <path class="s c" d="M-120 15 C 260 20, 720 9, 1320 17" stroke-width="2"   opacity=".65"/>
    <path class="s b" d="M-120 23 C 340 27, 680 17, 1320 24" stroke-width="1.2" opacity=".40"/>
  </g>
</svg>
