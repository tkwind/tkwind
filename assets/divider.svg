<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 20" width="1200" height="20" role="img" aria-label="">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7FD8D2" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#7FD8D2" stop-opacity=".35"/>
      <stop offset="50%"  stop-color="#FFB86B" stop-opacity=".45"/>
      <stop offset="82%"  stop-color="#7FD8D2" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#7FD8D2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7FD8D2" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#7FD8D2" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#7FD8D2" stop-opacity="0"/>
    </linearGradient>
    <style>
      .pulse { animation: travel 7s cubic-bezier(.45,.05,.55,.95) infinite; }
      @keyframes travel { from { transform: translateX(-220px); } to { transform: translateX(1420px); } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; visibility: hidden; } }
    </style>
  </defs>
  <rect x="0" y="9.5" width="1200" height="1" fill="url(#base)"/>
  <rect class="pulse" x="0" y="8.5" width="200" height="3" rx="1.5" fill="url(#pulse)"/>
</svg>
