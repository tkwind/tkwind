<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="tkwind — software engineer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="58%" stop-color="#13293B"/>
      <stop offset="100%" stop-color="#0A1620"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.10" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.84" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edges">
      <rect width="1200" height="300" fill="url(#fade)"/>
    </mask>
    <clipPath id="reveal">
      <rect id="revealRect" x="0" y="0" width="1200" height="300"/>
    </clipPath>

    <style>
      .streak { fill: none; stroke-linecap: round; }
      .aqua   { stroke: #7FD8D2; }
      .ember  { stroke: #FFB86B; }

      @keyframes gust { to { stroke-dashoffset: -1600; } }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
      @keyframes wipe { from { transform: scaleX(0); } }

      .g1 { stroke-dasharray: 210 1190; stroke-dashoffset: 1400; animation: gust  6.0s linear infinite; }
      .g2 { stroke-dasharray: 120 1280; stroke-dashoffset: 1400; animation: gust  8.5s linear infinite -1.2s; }
      .g3 { stroke-dasharray: 300 1100; stroke-dashoffset: 1400; animation: gust  7.2s linear infinite -3.0s; }
      .g4 { stroke-dasharray:  70 1330; stroke-dashoffset: 1400; animation: gust  5.2s linear infinite -0.6s; }
      .g5 { stroke-dasharray: 250 1150; stroke-dashoffset: 1400; animation: gust  9.8s linear infinite -4.4s; }
      .g6 { stroke-dasharray: 150 1250; stroke-dashoffset: 1400; animation: gust  6.8s linear infinite -2.1s; }
      .g7 { stroke-dasharray:  90 1310; stroke-dashoffset: 1400; animation: gust 11.0s linear infinite -5.5s; }
      .g8 { stroke-dasharray: 190 1210; stroke-dashoffset: 1400; animation: gust  7.9s linear infinite -0.3s; }

      #revealRect { transform-origin: 80px 0; animation: wipe 1.1s cubic-bezier(.16,.84,.44,1); }
      .rule       { transform-origin: 80px 0; animation: wipe 1.4s .35s cubic-bezier(.16,.84,.44,1) backwards; }
      .sub        { animation: rise 1.0s .55s ease-out backwards; }

      @media (prefers-reduced-motion: reduce) {
        .g1,.g2,.g3,.g4,.g5,.g6,.g7,.g8,#revealRect,.rule,.sub { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>

  <!-- wind field -->
  <g mask="url(#edges)">
    <path class="streak aqua g1" d="M-120 44 C 180 26, 520 62, 1320 38"  stroke-width="2"   opacity=".55"/>
    <path class="streak aqua g2" d="M-120 82 C 240 108, 600 58, 1320 92" stroke-width="1.2" opacity=".38"/>
    <path class="streak aqua g3" d="M-120 118 C 300 96, 700 138, 1320 108" stroke-width="2.6" opacity=".28"/>
    <path class="streak aqua g4" d="M-120 158 C 260 176, 640 132, 1320 164" stroke-width="1"  opacity=".30"/>
    <path class="streak ember g5" d="M-120 206 C 340 186, 720 226, 1320 196" stroke-width="2.2" opacity=".70"/>
    <path class="streak aqua g6" d="M-120 240 C 220 260, 660 216, 1320 250" stroke-width="1.6" opacity=".42"/>
    <path class="streak aqua g7" d="M-120 272 C 380 254, 740 288, 1320 262" stroke-width="1"  opacity=".30"/>
    <path class="streak aqua g8" d="M-120 14 C 300 30, 680 -4, 1320 22"  stroke-width="1.4" opacity=".25"/>
  </g>

  <!-- horizon hairline -->
  <rect x="0" y="286" width="1200" height="1" fill="#7FD8D2" opacity=".18"/>

  <!-- wordmark -->
  <g clip-path="url(#reveal)">
    <text x="80" y="168"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace"
          font-size="96" font-weight="700" letter-spacing="10" fill="#EDF2F4">tkwind</text>
  </g>

  <rect class="rule" x="80" y="192" width="252" height="3" fill="#FFB86B"/>

  <text class="sub" x="84" y="234"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace"
        font-size="19" font-weight="500" letter-spacing="6.5" fill="#7FD8D2" opacity=".92">DEVELOPER TOOLS THAT SHOW THEIR WORK</text>
</svg>
