<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="TKWIND — developer tools that show their work">
  <defs>
    <linearGradient id="bandg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="sweep">
      <rect class="band" x="-340" y="0" width="320" height="300" fill="url(#bandg)"/>
    </mask>
    <radialGradient id="vig" cx=".5" cy=".5" r=".72">
      <stop offset="62%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".38"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect y="3" width="4" height="1" fill="#000" opacity=".55"/>
    </pattern>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#7FD8D2" flood-opacity=".6"/>
    </filter>
    <clipPath id="panelclip"><rect x="6" y="6" width="1188" height="288" rx="16"/></clipPath>

    <style>
      text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 23px; }
      .boot, .tag { font-size: 19px; }
      .boot { font-size: 13px; letter-spacing: 2px; }

      /* scan band sweeping through the letterforms */
      .band { animation: sweep 4.8s linear infinite; }
      @keyframes sweep { to { transform: translateX(1880px); } }

      /* boot-in: each line flickers alive */
      .art { animation: flick .9s steps(1) backwards; }
      .l1 { animation-delay: .05s; } .l2 { animation-delay: .18s; }
      .l3 { animation-delay: .31s; } .l4 { animation-delay: .44s; }
      .l5 { animation-delay: .57s; } .l6 { animation-delay: .70s; }
      @keyframes flick {
        0% { opacity: 0; } 34% { opacity: 1; } 46% { opacity: 0; }
        58% { opacity: 1; } 70% { opacity: .4; } 82% { opacity: 1; }
      }

      /* rare glitch blip: jitter + chromatic ghosts flash on */
      .jit   { animation: jit 9s steps(1) infinite; }
      .ghost { opacity: 0; animation: ghost 9s steps(1) infinite; }
      @keyframes jit {
        0%, 100% { transform: translateX(0); }
        91% { transform: translateX(3px); }
        92.2% { transform: translateX(-2px); }
        93.4% { transform: translateX(0); }
      }
      @keyframes ghost {
        0%, 100% { opacity: 0; }
        91% { opacity: .55; }
        93.4% { opacity: 0; }
      }

      /* tagline — types and deletes four phrases on a 28s loop */
      .p1 { animation: p1 28s linear infinite; }
      .p2 { animation: p2 28s linear infinite; }
      .p3 { animation: p3 28s linear infinite; }
      .p4 { animation: p4 28s linear infinite; }
      @keyframes p1 {
        0%          { clip-path: inset(-8px 100% -8px 0); animation-timing-function: steps(36); }
        6%, 22%     { clip-path: inset(-8px 0% -8px 0);   animation-timing-function: steps(36); }
        24.2%, 100% { clip-path: inset(-8px 100% -8px 0); }
      }
      @keyframes p2 {
        0%, 25%     { clip-path: inset(-8px 100% -8px 0); animation-timing-function: steps(34); }
        31%, 47%    { clip-path: inset(-8px 0% -8px 0);   animation-timing-function: steps(34); }
        49.2%, 100% { clip-path: inset(-8px 100% -8px 0); }
      }
      @keyframes p3 {
        0%, 50%     { clip-path: inset(-8px 100% -8px 0); animation-timing-function: steps(45); }
        56%, 72%    { clip-path: inset(-8px 0% -8px 0);   animation-timing-function: steps(45); }
        74.2%, 100% { clip-path: inset(-8px 100% -8px 0); }
      }
      @keyframes p4 {
        0%, 75%     { clip-path: inset(-8px 100% -8px 0); animation-timing-function: steps(37); }
        81%, 97%    { clip-path: inset(-8px 0% -8px 0);   animation-timing-function: steps(37); }
        99.2%, 100% { clip-path: inset(-8px 100% -8px 0); }
      }
      .caret { animation: caretx 28s linear infinite, blink 1.1s steps(1) infinite; }
      @keyframes caretx {
        0%          { transform: translateX(0);     animation-timing-function: steps(36); }
        6%, 22%     { transform: translateX(396px); animation-timing-function: steps(36); }
        24.2%, 25%  { transform: translateX(0);     animation-timing-function: steps(34); }
        31%, 47%    { transform: translateX(374px); animation-timing-function: steps(34); }
        49.2%, 50%  { transform: translateX(0);     animation-timing-function: steps(45); }
        56%, 72%    { transform: translateX(495px); animation-timing-function: steps(45); }
        74.2%, 75%  { transform: translateX(0);     animation-timing-function: steps(37); }
        81%, 97%    { transform: translateX(407px); animation-timing-function: steps(37); }
        99.2%, 100% { transform: translateX(0); }
      }
      @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .band,.art,.jit,.ghost,.caret { animation: none; }
        .brt { mask: none; }
        .ghost,.caret { visibility: hidden; }
        .p1 { animation: none; }
        .p2,.p3,.p4 { animation: none; visibility: hidden; }
      }
    </style>
  </defs>

  <rect x="6.5" y="6.5" width="1187" height="287" rx="16" fill="#0A1420" stroke="#CBD9DD"/>

  <text class="boot" x="250" y="34" fill="#4A6A7E">// TKWIND@GITHUB — SIGNAL LOCKED</text>

  <g class="jit">
    <!-- chromatic ghosts (flash during the glitch blip) -->
    <g class="ghost">
    <text class="art l1" x="247.6" y="60.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#FF6B6B">████████╗██╗  ██╗██╗    ██╗██╗███╗   ██╗██████╗ </text>
    <text class="art l2" x="247.6" y="85.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#FF6B6B">╚══██╔══╝██║ ██╔╝██║    ██║██║████╗  ██║██╔══██╗</text>
    <text class="art l3" x="247.6" y="110.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#FF6B6B">   ██║   █████╔╝ ██║ █╗ ██║██║██╔██╗ ██║██║  ██║</text>
    <text class="art l4" x="247.6" y="135.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#FF6B6B">   ██║   ██╔═██╗ ██║███╗██║██║██║╚██╗██║██║  ██║</text>
    <text class="art l5" x="247.6" y="160.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#FF6B6B">   ██║   ██║  ██╗╚███╔███╔╝██║██║ ╚████║██████╔╝</text>
    <text class="art l6" x="247.6" y="185.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#FF6B6B">   ╚═╝   ╚═╝  ╚═╝ ╚══╝╚══╝ ╚═╝╚═╝  ╚═══╝╚═════╝ </text>
    </g>
    <g class="ghost">
    <text class="art l1" x="252.4" y="60.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#7FD8D2">████████╗██╗  ██╗██╗    ██╗██╗███╗   ██╗██████╗ </text>
    <text class="art l2" x="252.4" y="85.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#7FD8D2">╚══██╔══╝██║ ██╔╝██║    ██║██║████╗  ██║██╔══██╗</text>
    <text class="art l3" x="252.4" y="110.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#7FD8D2">   ██║   █████╔╝ ██║ █╗ ██║██║██╔██╗ ██║██║  ██║</text>
    <text class="art l4" x="252.4" y="135.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#7FD8D2">   ██║   ██╔═██╗ ██║███╗██║██║██║╚██╗██║██║  ██║</text>
    <text class="art l5" x="252.4" y="160.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#7FD8D2">   ██║   ██║  ██╗╚███╔███╔╝██║██║ ╚████║██████╔╝</text>
    <text class="art l6" x="252.4" y="185.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#7FD8D2">   ╚═╝   ╚═╝  ╚═╝ ╚══╝╚══╝ ╚═╝╚═╝  ╚═══╝╚═════╝ </text>
    </g>
    <!-- dim base -->
    <text class="art l1" x="250.0" y="60.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#42647A">████████╗██╗  ██╗██╗    ██╗██╗███╗   ██╗██████╗ </text>
    <text class="art l2" x="250.0" y="85.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#42647A">╚══██╔══╝██║ ██╔╝██║    ██║██║████╗  ██║██╔══██╗</text>
    <text class="art l3" x="250.0" y="110.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#42647A">   ██║   █████╔╝ ██║ █╗ ██║██║██╔██╗ ██║██║  ██║</text>
    <text class="art l4" x="250.0" y="135.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#42647A">   ██║   ██╔═██╗ ██║███╗██║██║██║╚██╗██║██║  ██║</text>
    <text class="art l5" x="250.0" y="160.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#42647A">   ██║   ██║  ██╗╚███╔███╔╝██║██║ ╚████║██████╔╝</text>
    <text class="art l6" x="250.0" y="185.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#42647A">   ╚═╝   ╚═╝  ╚═╝ ╚══╝╚══╝ ╚═╝╚═╝  ╚═══╝╚═════╝ </text>
    <!-- lit copy, revealed by the sweeping band -->
    <g class="brt" mask="url(#sweep)" filter="url(#bloom)">
    <text class="art l1" x="250.0" y="60.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#7FD8D2">████████╗██╗  ██╗██╗    ██╗██╗███╗   ██╗██████╗ </text>
    <text class="art l2" x="250.0" y="85.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#7FD8D2">╚══██╔══╝██║ ██╔╝██║    ██║██║████╗  ██║██╔══██╗</text>
    <text class="art l3" x="250.0" y="110.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#7FD8D2">   ██║   █████╔╝ ██║ █╗ ██║██║██╔██╗ ██║██║  ██║</text>
    <text class="art l4" x="250.0" y="135.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#7FD8D2">   ██║   ██╔═██╗ ██║███╗██║██║██║╚██╗██║██║  ██║</text>
    <text class="art l5" x="250.0" y="160.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#7FD8D2">   ██║   ██║  ██╗╚███╔███╔╝██║██║ ╚████║██████╔╝</text>
    <text class="art l6" x="250.0" y="185.0" textLength="700" lengthAdjust="spacingAndGlyphs" fill="#7FD8D2">   ╚═╝   ╚═╝  ╚═╝ ╚══╝╚══╝ ╚═╝╚═╝  ╚═══╝╚═════╝ </text>
    </g>
  </g>

  <!-- tagline -->
  <g class="tag">
    <text x="250" y="240" font-size="19" fill="#FFB86B">$</text>
    <text class="p1" x="272" y="240" font-size="19" fill="#7FD8D2" textLength="396" lengthAdjust="spacingAndGlyphs">developer tools that show their work</text>
    <text class="p2" x="272" y="240" font-size="19" fill="#7FD8D2" textLength="374" lengthAdjust="spacingAndGlyphs">evidence first — label the guesses</text>
    <text class="p3" x="272" y="240" font-size="19" fill="#7FD8D2" textLength="495" lengthAdjust="spacingAndGlyphs">CLI design · API debugging · auditable agents</text>
    <text class="p4" x="272" y="240" font-size="19" fill="#7FD8D2" textLength="407" lengthAdjust="spacingAndGlyphs">Python · TypeScript · FastAPI · React</text>
    <rect class="caret" x="274" y="225" width="10" height="19" fill="#7FD8D2"/>
  </g>

  <!-- CRT overlays -->
  <rect width="1200" height="300" fill="url(#scan)" opacity=".16" clip-path="url(#panelclip)"/>
  <rect width="1200" height="300" fill="url(#vig)" clip-path="url(#panelclip)"/>
</svg>
