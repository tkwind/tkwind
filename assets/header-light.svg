<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="tkwind — developer tools that show their work">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FBFB"/>
      <stop offset="100%" stop-color="#ECF3F3"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14807C"/>
      <stop offset="100%" stop-color="#C86A1E"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#7FD8D2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7FD8D2" stop-opacity=".40"/>
      <stop offset="100%" stop-color="#7FD8D2" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#14807C" opacity=".07"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <clipPath id="wordclip">
      <text x="80" y="168" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace"
            font-size="96" font-weight="700" letter-spacing="10">tkwind</text>
    </clipPath>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; }

      /* aurora — slow breathing gradient blobs */
      .b1 { animation: drift1 22s ease-in-out infinite alternate; }
      .b2 { animation: drift2 27s ease-in-out infinite alternate; }
      .b3 { animation: drift3 31s ease-in-out infinite alternate; }
      @keyframes drift1 { to { transform: translate(70px, 24px)  scale(1.15); } }
      @keyframes drift2 { to { transform: translate(-80px, -18px) scale(1.08); } }
      @keyframes drift3 { to { transform: translate(50px, -26px) scale(1.22); } }

      /* wordmark entrance + sheen sweep */
      .word  { animation: rise .9s cubic-bezier(.16,.84,.44,1) backwards; }
      .sweep { animation: sweep 7s ease-in-out .9s infinite; }
      @keyframes rise  { from { opacity: 0; transform: translateY(14px); } }
      @keyframes sweep { 0% { transform: translateX(-420px); } 42%, 100% { transform: translateX(1300px); } }

      .rulebar { transform-origin: 80px 0; animation: wipe 1.2s .3s cubic-bezier(.16,.84,.44,1) backwards; }
      @keyframes wipe { from { transform: scaleX(0); } }

      /* tagline — types and deletes four phrases on a 28s loop */
      .p1 { animation: p1 28s linear infinite; }
      .p2 { animation: p2 28s linear infinite; }
      .p3 { animation: p3 28s linear infinite; }
      .p4 { animation: p4 28s linear infinite; }
      @keyframes p1 {
        0%          { clip-path: inset(-8px 100% -8px 0); animation-timing-function: steps(36); }
        6%, 22%     { clip-path: inset(-8px 0% -8px 0);   animation-timing-function: steps(36); }
        24.2%, 100% { clip-path: inset(-8px 100% -8px 0); }
      }
      @keyframes p2 {
        0%, 25%     { clip-path: inset(-8px 100% -8px 0); animation-timing-function: steps(34); }
        31%, 47%    { clip-path: inset(-8px 0% -8px 0);   animation-timing-function: steps(34); }
        49.2%, 100% { clip-path: inset(-8px 100% -8px 0); }
      }
      @keyframes p3 {
        0%, 50%     { clip-path: inset(-8px 100% -8px 0); animation-timing-function: steps(45); }
        56%, 72%    { clip-path: inset(-8px 0% -8px 0);   animation-timing-function: steps(45); }
        74.2%, 100% { clip-path: inset(-8px 100% -8px 0); }
      }
      @keyframes p4 {
        0%, 75%     { clip-path: inset(-8px 100% -8px 0); animation-timing-function: steps(37); }
        81%, 97%    { clip-path: inset(-8px 0% -8px 0);   animation-timing-function: steps(37); }
        99.2%, 100% { clip-path: inset(-8px 100% -8px 0); }
      }

      .caret  { animation: caretx 28s linear infinite, blink 1.1s steps(1) infinite; }
      @keyframes caretx {
        0%          { transform: translateX(0);     animation-timing-function: steps(36); }
        6%, 22%     { transform: translateX(396px); animation-timing-function: steps(36); }
        24.2%, 25%  { transform: translateX(0);     animation-timing-function: steps(34); }
        31%, 47%    { transform: translateX(374px); animation-timing-function: steps(34); }
        49.2%, 50%  { transform: translateX(0);     animation-timing-function: steps(45); }
        56%, 72%    { transform: translateX(495px); animation-timing-function: steps(45); }
        74.2%, 75%  { transform: translateX(0);     animation-timing-function: steps(37); }
        81%, 97%    { transform: translateX(407px); animation-timing-function: steps(37); }
        99.2%, 100% { transform: translateX(0); }
      }
      @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .b1,.b2,.b3,.word,.sweep,.rulebar { animation: none; }
        .p1 { animation: none; }                            /* clip-path defaults to none → fully shown */
        .p2,.p3,.p4,.caret { animation: none; visibility: hidden; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>

  <!-- aurora field -->
  <g filter="url(#soft)">
    <ellipse class="b1" cx="950"  cy="70"  rx="300" ry="130" fill="#8ED2CD" opacity=".45"/>
    <ellipse class="b2" cx="330"  cy="260" rx="340" ry="120" fill="#BCE3E0" opacity=".55"/>
    <ellipse class="b3" cx="1120" cy="270" rx="240" ry="110" fill="#FFD9AC" opacity=".45"/>
  </g>

  <rect width="1200" height="300" fill="url(#dots)"/>

  <!-- wordmark -->
  <g class="word">
    <text class="mono" x="80" y="168" font-size="96" font-weight="700" letter-spacing="10" fill="#0D1B2A">tkwind</text>
    <g clip-path="url(#wordclip)">
      <g transform="rotate(14 80 120)"><rect class="sweep" x="-40" y="20" width="220" height="220" fill="url(#sheen)"/></g>
    </g>
  </g>

  <rect class="rulebar" x="80" y="192" width="300" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- tagline -->
  <g class="mono" font-size="19">
    <text x="80" y="238" fill="#C86A1E">$</text>
    <text class="p1" x="102" y="238" fill="#14807C" textLength="396" lengthAdjust="spacingAndGlyphs">developer tools that show their work</text>
    <text class="p2" x="102" y="238" fill="#14807C" textLength="374" lengthAdjust="spacingAndGlyphs">evidence first — label the guesses</text>
    <text class="p3" x="102" y="238" fill="#14807C" textLength="495" lengthAdjust="spacingAndGlyphs">CLI design · API debugging · auditable agents</text>
    <text class="p4" x="102" y="238" fill="#14807C" textLength="407" lengthAdjust="spacingAndGlyphs">Python · TypeScript · FastAPI · React</text>
    <rect class="caret" x="104" y="223" width="10" height="19" fill="#14807C"/>
  </g>

  <!-- horizon hairline -->
  <rect x="0" y="297" width="1200" height="1" fill="#14807C" opacity=".22"/>
</svg>
